# 883926 高贝塔 · 策略层 topk/n_drop sweep — W1（test 2026-04→07）
# 运行：conda run -n qlib_ifind_beta python examples/champion/run.py examples/champion/workflow_minute_enhanced_tk10_nd8.yaml
#
# 2026-09-26 环境修复移植（与 factor zoo 冻结协议 qlib_ifind_beta/experiment/protocol.py 同源）：
# ② universe 换 highbeta883926_dayok —— data/qlib_root 后来长出的 99 只仅分钟源股票
#    缺日线 bin，会卡死/崩掉 PortAna 回测；dayok 过滤后成员行 -0.9%（全量 55792 → 55271）。
# ③ exchange 显式 codes=dayok —— 默认 codes='all' 载全市场（加载量 -98%）。
# ① joblib 死锁修复在 run.py（C['joblib_backend']='threading'）。
#
# 目的：策略参数 sweep——唯一变量 topk/n_drop（champion 20/15 → 10/8），handler/label/model/exchange/切分
# 当前生产 Champion：18 因子、Top10/n_drop=8，配置与模型参数全冻结。
# n_drop=8=80% 换手帽：同 topk=10 浓缩度下测高换手 regime（§22.3 在小 topk 下换手帽对成本/alpha 的边界）。
qlib_init:
    provider_uri: /home/zxh/projects/3.qlib_ifind_beta/data/qlib_root
    region: cn

experiment_name: minute_enhanced_tk10_nd8

market: &market highbeta883926_dayok   # 修复②：dayok universe（见文件头）
benchmark: &benchmark SH000300

data_handler_config: &data_handler_config
    start_time: 2024-01-01
    end_time: 2026-07-02
    fit_start_time: 2024-01-01
    fit_end_time: 2025-12-31
    instruments: *market
    # Label v2（2026-09-12 采纳，分钟口径）：T 日 09:41（1min 原值）买入、
    # T+1 15:00（1min 原值）卖出的收益；两腿同源消除混合基准。
    label:
        - Ref($close1500, -1) / $close0941 - 1

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategyTD0
        module_path: qlib_ifind_beta.trading.td0_strategy
        kwargs:
            signal: <PRED>
            topk: 10
            n_drop: 8        # sweep：80% 换手帽（高换手 regime 探针）
            hold_thresh: 1
            forbid_all_trade_at_limit: true
    backtest:
        start_time: 2026-04-01
        end_time: 2026-07-01
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            freq: day
            codes: highbeta883926_dayok   # 修复③：显式 codes（见文件头）
            limit_threshold:
                - $change_941 >= $limit_up
                - $change <= $limit_down
            deal_price: ["$price_941", "$close"]
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5

task:
    model:
        class: HFLGBModel
        module_path: qlib.contrib.model.highfreq_gdbt_model
        kwargs:
            loss: binary
            learning_rate: 0.05
            max_depth: 6
            num_leaves: 64
            num_threads: 20
            lambda_l1: 5.0
            lambda_l2: 10.0
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: MinuteEnhancedHandler
                module_path: qlib_ifind_beta.factor.minute_enhanced_handler
                kwargs: *data_handler_config
            segments:
                train: [2024-01-01, 2025-12-31]
                valid: [2026-01-01, 2026-03-31]
                test:  [2026-04-01, 2026-07-02]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              config: *port_analysis_config
