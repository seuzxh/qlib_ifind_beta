# 883926 高贝塔 · 分钟因子增强 iteration-9（2026-07-07）★ champion
# 运行：conda run -n qlib_ifind_beta python qrun/run.py qrun/workflow_minute_enhanced.yaml
#
# §33（2026-07-08）策略层 sweep：topk/n_drop 20/15 → 10/8 双窗双赢
#   W1 +158.9%→+191.1%(+32.2pp) / W2 +63.2%→+75.9%(+12.8pp) / W1 回撤 −5.59%(在 −10% gate 内)
#   机制：topk=10 集中头部 alpha（rank1-10 ≫ rank11-20）+ n_drop=8 高换手保鲜信号。
#   因子集(18)/label/deal_price/涨跌停拦截/模型超参/切分 全 FROZEN —— 唯一变量 topk/n_drop。
#
# 迭代史：iteration-7 发现 n_drop=15 是策略甜点（m14 +28%→+116%）；iteration-9 在其下验证
# 因子维度杠杆：14 分钟全集 + 4 extra（vol_vs_yest_t2/t3/t5 + overnight_gap）= 18 因子。
# 4 extra 均与 ~1.5 天 label 同周期（分钟族 + 跳空），不会重蹈 full(85) 日频稀释覆辙（§19.1）。
# label / deal_price / 涨跌停拦截 / 模型超参 / 切分全部与 workflow_minute_only.yaml 一致
# → 与 m14 严格可比，唯一变量是 feature 14 → 18 + 策略 n_drop 5 → 15。
# Handler = MinuteEnhancedHandler（HighBetaAlpha158 子类，仅 override get_feature_config 返回 18 因子）。
qlib_init:
    provider_uri: /home/zxh/projects/3.qlib_ifind_beta/data/qlib_root
    region: cn

experiment_name: minute_enhanced

market: &market highbeta883926
benchmark: &benchmark SH000300

data_handler_config: &data_handler_config
    start_time: 2024-01-01
    end_time: 2026-07-02
    fit_start_time: 2024-01-01
    fit_end_time: 2025-12-31
    instruments: *market
    # Label（与 workflow_minute_only.yaml 一致，FROZEN）：T 日 9:41 买入、T+1 收盘卖出的收益。
    label:
        - Ref($close, -1) / $price_941 - 1

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategyTD0
        module_path: qlib_ifind_beta.td0_strategy
        kwargs:
            signal: <PRED>
            topk: 10
            n_drop: 8         # §33 sweep 双窗双赢（20/15→10/8：头部集中 + 信号保鲜）
            hold_thresh: 1
            forbid_all_trade_at_limit: true
    backtest:
        start_time: 2026-04-01
        end_time: 2026-07-01
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            freq: day
            limit_threshold:
                - $change_941 >= $limit_up
                - $change <= $limit_down
            deal_price: ["$price_941", "$close"]
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5

task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            learning_rate: 0.05
            max_depth: 6
            num_leaves: 64
            num_threads: 20
            lambda_l1: 5.0
            lambda_l2: 10.0
            num_boost_round: 200
            early_stopping_rounds: 20
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: MinuteEnhancedHandler    # HighBetaAlpha158 子类，18 因子（14 全集 + 4 extra）
                module_path: qlib_ifind_beta.minute_enhanced_handler
                kwargs: *data_handler_config
            segments:
                train: [2024-01-01, 2025-12-31]
                valid: [2026-01-01, 2026-03-31]
                test:  [2026-04-01, 2026-07-02]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              config: *port_analysis_config
