# [W2 OOS] 共振因子 on shifted window (test 2025-04->07). 1yr back from W1 test.
# 883926 高贝塔 · 上证指数开盘共振因子（goal 2026-07-08「分钟尺度 regime」实做）
# 运行：conda run -n qlib_ifind_beta python qrun/run.py qrun/workflow_minute_resonance_w2.yaml
#
# 目的：§23-28 八重墙后，唯一原则性未测杠杆 = 分钟尺度指数开盘共振。用户领域模型「T 日
# 9:30-9:40 开盘分钟内个股 vs 指数的横截面相对强度」（scale 与 ~1.5 天 label 对齐，无 §28
# 日频 regime 的 scale 错配）。3 idx 因子（idx_open_ret_10/idx_open_mom_5m/idx_open_accel_5m）
# 与 champion startup_total/startup_mom_5m/accel_5m 公式同构，broadcast 同值 → 18 + 3 = 21 因子。
# label / deal_price / 涨跌停拦截 / 模型超参 / 切分 / 策略全部与 workflow_minute_enhanced_w2.yaml
# 一致 → 与 champion 严格可比，唯一变量是 feature 18 → 21。
# Handler = MinuteResonanceHandler（MinuteEnhancedHandler 子类，21 因子）。详见 backtest-log §29。
qlib_init:
    provider_uri: /home/zxh/projects/3.qlib_ifind_beta/data/qlib_root
    region: cn

experiment_name: minute_resonance_w2

market: &market highbeta883926
benchmark: &benchmark SH000300

data_handler_config: &data_handler_config
    start_time: 2024-01-01
    end_time: 2025-07-04
    fit_start_time: 2024-01-01
    fit_end_time: 2025-03-31
    instruments: *market
    # Label（与 workflow_minute_enhanced_w2.yaml 一致，FROZEN）：T 日 9:41 买入、T+1 收盘卖出的收益。
    label:
        - Ref($close, -1) / $price_941 - 1

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategyTD0
        module_path: qlib_ifind_beta.td0_strategy
        kwargs:
            signal: <PRED>
            topk: 20
            n_drop: 15        # champion 甜点（iteration-7）
            hold_thresh: 1
            forbid_all_trade_at_limit: true
    backtest:
        start_time: 2025-04-01
        end_time: 2025-07-01
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            freq: day
            limit_threshold:
                - $change_941 >= $limit_up
                - $change <= $limit_down
            deal_price: ["$price_941", "$close"]
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5

task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            learning_rate: 0.05
            max_depth: 6
            num_leaves: 64
            num_threads: 20
            lambda_l1: 5.0
            lambda_l2: 10.0
            num_boost_round: 200
            early_stopping_rounds: 20
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: MinuteResonanceHandler    # MinuteEnhancedHandler 子类，21 因子（18 champion + 3 idx 共振）
                module_path: qlib_ifind_beta.minute_resonance_handler
                kwargs: *data_handler_config
            segments:
                train: [2024-01-01, 2024-12-31]
                valid: [2025-01-01, 2025-03-31]
                test:  [2025-04-01, 2025-07-02]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              config: *port_analysis_config
