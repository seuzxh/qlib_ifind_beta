# 883926 高贝塔 · T-1 开盘因子增强 V1（goal「扩展不同区间的 1min 因子」，2026-07-08）
# 运行：conda run -n qlib_ifind_beta python qrun/run.py qrun/workflow_minute_enhanced_opening_t1.yaml
#
# 目的：破 §23/§24/§25 三重 IC→超额墙。假设 = T-1 **开盘**（slot 1-10，与 T 日开盘同 regime、
# 仅时间平移）跨日持续则**共线强化** topk=20 边界（非正交重排），可能破墙。V1 = §25 头对头：
# 18 + [vol_ratio_5m_t1, accel_5m_t1] = 20（T-1 开盘 |mean_ic| top-2；同 count、同 shift-1、
# 仅 regime 不同 → 隔离「同 regime 滞后 vs 不同 regime」）。
# IC 校准（全段 2024-2026）：vol_ratio 族跨日持续（共线）→ t2#1/baseline#2/t1#4 全正单调；
# accel/startup 族不持续。单因子 |IC|<0.03 为 baseline 常态。
# label / deal_price / 涨跌停拦截 / 模型超参 / 切分全部与 champion 一致 → 唯一变量 feature 18→20。
# Handler = MinuteEnhancedOpeningT1Handler（MinuteEnhancedHandler 子类，get_feature_config 追加 2 T-1 开盘）。
qlib_init:
    provider_uri: /home/zxh/projects/3.qlib_ifind_beta/data/qlib_root
    region: cn

experiment_name: minute_enhanced_opening_t1

market: &market highbeta883926
benchmark: &benchmark SH000300

data_handler_config: &data_handler_config
    start_time: 2024-01-01
    end_time: 2026-07-02
    fit_start_time: 2024-01-01
    fit_end_time: 2025-12-31
    instruments: *market
    # Label（FROZEN，与 champion 一致）：T 日 9:41 买入、T+1 收盘卖出的收益。
    label:
        - Ref($close, -1) / $price_941 - 1

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategyTD0
        module_path: qlib_ifind_beta.td0_strategy
        kwargs:
            signal: <PRED>
            topk: 20
            n_drop: 15        # champion 甜点（FROZEN）
            hold_thresh: 1
            forbid_all_trade_at_limit: true
    backtest:
        start_time: 2026-04-01
        end_time: 2026-07-01
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            freq: day
            limit_threshold:
                - $change_941 >= $limit_up
                - $change <= $limit_down
            deal_price: ["$price_941", "$close"]
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5

task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            learning_rate: 0.05
            max_depth: 6
            num_leaves: 64
            num_threads: 20
            lambda_l1: 5.0
            lambda_l2: 10.0
            num_boost_round: 200
            early_stopping_rounds: 20
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: MinuteEnhancedOpeningT1Handler    # 20 因子（18 + 2 T-1 开盘）
                module_path: qlib_ifind_beta.minute_enhanced_opening_handler
                kwargs: *data_handler_config
            segments:
                train: [2024-01-01, 2025-12-31]
                valid: [2026-01-01, 2026-03-31]
                test:  [2026-04-01, 2026-07-02]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              config: *port_analysis_config
