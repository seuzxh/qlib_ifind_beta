# 883926 高贝塔 · 30 因子合体 Step B（2026-07-07）
# 运行：conda run -n qlib_ifind_beta python qrun/run.py qrun/workflow_enhanced_daily_index.yaml
#
# 目的（用户 /loop 2026-07-07）：在 champion=enhanced(18)@n_drop=15 基础上验证日频情绪 + 上证指数
# 共振因子能否提升预测准确性。两步走：Step A（workflow_daily_index.yaml）已单独验证 12 因子
# test 段 IC=0.0366（> m14 baseline 0.0341，Gate 通过）；Step B 合体 30=18min+12daily 看协同增益。
#
# 风险：§19.1 full(85=14min+71daily) 日频稀释 9:41 信号；但本任务 12 日频是精选短周期(5/9/20日)
# + 指数共振，非 Alpha158 全集（无 60 日慢均线），尺度更贴近 label，稀释风险理论上低于 full(85)。
# 结果不确定 → 本 run 即为验证。
#
# L1 护栏：本 handler 含完整 18 分钟因子 → p941→分钟因子→drop 联动恢复，DropnaProcessor 对 30
# feature 任一 NaN 即 drop，护栏与 champion 等价 → 回测可与 champion 直接对比（区别于 Step A）。
#
# label / deal_price / 涨跌停拦截 / 模型超参 / 切分全部与 workflow_minute_enhanced.yaml（champion）一致
# → 与 champion 严格可比，唯一变量是 feature 18 → 30。
# Handler = EnhancedWithDailyIndex（HighBetaAlpha158 子类，仅 override get_feature_config 返回 30 因子）。
qlib_init:
    provider_uri: /home/zxh/projects/3.qlib_ifind_beta/data/qlib_root
    region: cn

experiment_name: enhanced_daily_index

market: &market highbeta883926
benchmark: &benchmark SH000300

data_handler_config: &data_handler_config
    start_time: 2024-01-01
    end_time: 2026-07-02
    fit_start_time: 2024-01-01
    fit_end_time: 2025-12-31
    instruments: *market
    # Label（与 champion 一致，FROZEN）：T 日 9:41 买入、T+1 收盘卖出的收益。
    label:
        - Ref($close, -1) / $price_941 - 1

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategyTD0
        module_path: qlib_ifind_beta.td0_strategy
        kwargs:
            signal: <PRED>
            topk: 20
            n_drop: 15        # 与 champion 一致（FROZEN）
            hold_thresh: 1
            forbid_all_trade_at_limit: true
    backtest:
        start_time: 2026-04-01
        end_time: 2026-07-01
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            freq: day
            limit_threshold:
                - $change_941 >= $limit_up
                - $change <= $limit_down
            deal_price: ["$price_941", "$close"]
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5

task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            learning_rate: 0.05
            max_depth: 6
            num_leaves: 64
            num_threads: 20
            lambda_l1: 5.0
            lambda_l2: 10.0
            num_boost_round: 200
            early_stopping_rounds: 20
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: EnhancedWithDailyIndex    # HighBetaAlpha158 子类，30 因子（18 分钟 + 12 日频/指数）
                module_path: qlib_ifind_beta.enhanced_daily_index_handler
                kwargs: *data_handler_config
            segments:
                train: [2024-01-01, 2025-12-31]
                valid: [2026-01-01, 2026-03-31]
                test:  [2026-04-01, 2026-07-02]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              config: *port_analysis_config
