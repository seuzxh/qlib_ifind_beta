# 883926 高贝塔 · T-1/T-2 持续量比增强 V1b（goal「扩展不同区间的 1min 因子」，2026-07-08）
# 运行：conda run -n qlib_ifind_beta python qrun/run.py qrun/workflow_minute_enhanced_opening_vol.yaml
#
# 目的：破 §23/§24/§25 三重 IC→超额墙。IC 校准（全段 2024-2026）发现 vol_ratio 族**跨日持续**
# （共线信号）：vol_ratio_5m_t2 +0.0297（15 因子 #1）/ vol_ratio_5m（baseline）+0.0252（#2）/
# vol_ratio_5m_t1 +0.0187（#4）→ 全正单调 → 开盘量比是真实跨日持续边际。V1b = IC 驱动最强共线检验：
# 18 + [vol_ratio_5m_t1, vol_ratio_5m_t2] = 20，直接测「持续开盘量比是否共线强化 topk=20 边界」
# （破墙的最强检验，对齐用户心法 T-1 K 线判共振/惯性）。
# label / deal_price / 涨跌停拦截 / 模型超参 / 切分全部与 champion 一致 → 唯一变量 feature 18→20。
# Handler = MinuteEnhancedOpeningVolHandler（MinuteEnhancedHandler 子类，get_feature_config 追加 2 量比 lag）。
qlib_init:
    provider_uri: /home/zxh/projects/3.qlib_ifind_beta/data/qlib_root
    region: cn

experiment_name: minute_enhanced_opening_vol

market: &market highbeta883926
benchmark: &benchmark SH000300

data_handler_config: &data_handler_config
    start_time: 2024-01-01
    end_time: 2026-07-02
    fit_start_time: 2024-01-01
    fit_end_time: 2025-12-31
    instruments: *market
    # Label（FROZEN，与 champion 一致）：T 日 9:41 买入、T+1 收盘卖出的收益。
    label:
        - Ref($close, -1) / $price_941 - 1

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategyTD0
        module_path: qlib_ifind_beta.td0_strategy
        kwargs:
            signal: <PRED>
            topk: 20
            n_drop: 15        # champion 甜点（FROZEN）
            hold_thresh: 1
            forbid_all_trade_at_limit: true
    backtest:
        start_time: 2026-04-01
        end_time: 2026-07-01
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            freq: day
            limit_threshold:
                - $change_941 >= $limit_up
                - $change <= $limit_down
            deal_price: ["$price_941", "$close"]
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5

task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            learning_rate: 0.05
            max_depth: 6
            num_leaves: 64
            num_threads: 20
            lambda_l1: 5.0
            lambda_l2: 10.0
            num_boost_round: 200
            early_stopping_rounds: 20
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: MinuteEnhancedOpeningVolHandler    # 20 因子（18 + 2 持续量比 lag）
                module_path: qlib_ifind_beta.minute_enhanced_opening_handler
                kwargs: *data_handler_config
            segments:
                train: [2024-01-01, 2025-12-31]
                valid: [2026-01-01, 2026-03-31]
                test:  [2026-04-01, 2026-07-02]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              config: *port_analysis_config
