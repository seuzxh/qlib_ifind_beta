# 883926 高贝塔 · 策略层 topk/n_drop sweep — W1（test 2026-04→07）
# 运行：conda run -n qlib_ifind_beta python qrun/run.py qrun/workflow_minute_enhanced_tk5_nd3.yaml
#
# 目的：策略参数 sweep——唯一变量 topk/n_drop（champion 20/15 → 5/3），handler/label/model/exchange/切分
# 全 FROZEN vs champion workflow_minute_enhanced.yaml。第一性判读：top-10 内部 rank 1-5(+1.105)≈6-10(+1.104)，
# topk=5 无 per-name alpha 优势、只增集中度风险 → 本点为压测（预期劣于 topk=10），实证确认 topk=10 是甜点。
qlib_init:
    provider_uri: /home/zxh/projects/3.qlib_ifind_beta/data/qlib_root
    region: cn

experiment_name: minute_enhanced_tk5_nd3

market: &market highbeta883926
benchmark: &benchmark SH000300

data_handler_config: &data_handler_config
    start_time: 2024-01-01
    end_time: 2026-07-02
    fit_start_time: 2024-01-01
    fit_end_time: 2025-12-31
    instruments: *market
    # Label（FROZEN）：T 日 9:41 买入、T+1 收盘卖出的收益。
    label:
        - Ref($close, -1) / $price_941 - 1

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategyTD0
        module_path: qlib_ifind_beta.td0_strategy
        kwargs:
            signal: <PRED>
            topk: 5
            n_drop: 3        # sweep：60% 换手帽（topk=5 压测点）
            hold_thresh: 1
            forbid_all_trade_at_limit: true
    backtest:
        start_time: 2026-04-01
        end_time: 2026-07-01
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            freq: day
            limit_threshold:
                - $change_941 >= $limit_up
                - $change <= $limit_down
            deal_price: ["$price_941", "$close"]
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5

task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            learning_rate: 0.05
            max_depth: 6
            num_leaves: 64
            num_threads: 20
            lambda_l1: 5.0
            lambda_l2: 10.0
            num_boost_round: 200
            early_stopping_rounds: 20
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: MinuteEnhancedHandler
                module_path: qlib_ifind_beta.minute_enhanced_handler
                kwargs: *data_handler_config
            segments:
                train: [2024-01-01, 2025-12-31]
                valid: [2026-01-01, 2026-03-31]
                test:  [2026-04-01, 2026-07-02]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
              config: *port_analysis_config
